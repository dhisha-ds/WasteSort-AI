<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title th:text="${pageTitle} ?: 'WasteSort AI — Waste Segregation System'">WasteSort AI — Waste Segregation System</title>
</head>
<body>
  <!-- Navigation Fragment -->
  <nav th:fragment="navbar(activePage)" class="ws-navbar">
    <div class="ws-container ws-nav-container">
      <a th:href="@{/}" class="ws-brand">
        <span class="ws-brand-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 19H4.815a1.83 1.83 0 0 1-1.57-.881 1.785 1.785 0 0 1-.004-1.784L7.196 9.5"/>
            <path d="M11 19h8.2a1.8 1.8 0 0 0 1.57-.88 1.785 1.785 0 0 0 .004-1.784l-4.04-7.014"/>
            <path d="m14 14 3-6-3-6"/>
            <path d="M10.8 5.2 8.4 9.4"/>
            <path d="m14 8-4-4-4 4"/>
          </svg>
        </span>
        <span class="ws-brand-name">WasteSort <span class="ws-brand-highlight">AI</span></span>
      </a>

      <!-- Desktop Navigation Links -->
      <div class="ws-nav-links">
        <a th:href="@{/}" th:classappend="${activePage == 'dashboard'} ? 'active' : ''" class="ws-nav-link">Dashboard</a>
        <a th:href="@{/classify}" th:classappend="${activePage == 'classify'} ? 'active' : ''" class="ws-nav-link">Classify Waste</a>
        <a th:href="@{/history}" th:classappend="${activePage == 'history'} ? 'active' : ''" class="ws-nav-link">History</a>
        <a th:href="@{/about}" th:classappend="${activePage == 'about'} ? 'active' : ''" class="ws-nav-link">About</a>
      </div>

      <!-- Action Button -->
      <div class="ws-nav-action">
        <a th:href="@{/classify}" class="ws-btn ws-btn-primary ws-nav-cta">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" x2="12" y1="3" y2="15"/>
          </svg>
          Sort Waste Now
        </a>
      </div>

      <!-- Mobile Hamburger Button -->
      <button class="ws-mobile-toggle" id="wsMobileToggle" aria-label="Toggle navigation menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" x2="20" y1="12" y2="12"/>
          <line x1="4" x2="20" y1="6" y2="6"/>
          <line x1="4" x2="20" y1="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Mobile Dropdown Menu -->
    <div class="ws-mobile-menu" id="wsMobileMenu">
      <a th:href="@{/}" th:classappend="${activePage == 'dashboard'} ? 'active' : ''" class="ws-mobile-link">Dashboard</a>
      <a th:href="@{/classify}" th:classappend="${activePage == 'classify'} ? 'active' : ''" class="ws-mobile-link">Classify Waste</a>
      <a th:href="@{/history}" th:classappend="${activePage == 'history'} ? 'active' : ''" class="ws-mobile-link">History</a>
      <a th:href="@{/about}" th:classappend="${activePage == 'about'} ? 'active' : ''" class="ws-mobile-link">About</a>
    </div>
  </nav>
</body>
</html>
