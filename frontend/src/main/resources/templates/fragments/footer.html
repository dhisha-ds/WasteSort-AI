<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>

  <footer th:fragment="footer" class="ws-footer-compact">
    <div class="ws-container">
      <div class="ws-footer-compact-row">
        <!-- Brand & Slogan -->
        <div class="ws-footer-brand-compact">
          <span class="ws-brand-icon-sm">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">

          <span class="ws-slogan-compact">· A Greener Tomorrow Starts With You</span>

        <!-- Quick Links -->

          <a th:href="@{/}" class="ws-footer-link">Dashboard</a>
          <a th:href="@{/classify}" class="ws-footer-link">Classify Waste</a>

        <div class="ws-copyright-compact">

</html>
